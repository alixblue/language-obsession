<title>Laoshi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: a one-column study desk. Sticky top bar (brand + language switch), content cards, fixed bottom tab bar on every width. */
:root{
  --bg:#F1F5F3; --surface:#FFFFFF; --surface2:#E6EDEA; --ink:#13201D; --muted:#586966; --line:#D2DCD8;
  --accent:#0C7A64; --accent-soft:#D5EEE7; --on-accent:#FFFFFF;
  --good:#1D7F3C; --warn:#A8620A; --bad:#B8322A;
  --b1:#E58A3A; --b2:#D3B94C; --b3:#86BF8E; --b4:#2E9C7D; --b5:#0B6556;
  --font-ui:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-han:'Noto Serif SC','Songti SC','STSong','SimSun',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1513; --surface:#15201D; --surface2:#1E2D29; --ink:#E5EFEC; --muted:#8CA29C; --line:#2A3B37;
  --accent:#3FC5A4; --accent-soft:#17382F; --on-accent:#06251D;
  --good:#5ED188; --warn:#E3A94F; --bad:#F07C72;
  --b1:#F09A50; --b2:#D8C25A; --b3:#79B785; --b4:#37AE8D; --b5:#1E8A74; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1513; --surface:#15201D; --surface2:#1E2D29; --ink:#E5EFEC; --muted:#8CA29C; --line:#2A3B37;
  --accent:#3FC5A4; --accent-soft:#17382F; --on-accent:#06251D;
  --good:#5ED188; --warn:#E3A94F; --bad:#F07C72;
  --b1:#F09A50; --b2:#D8C25A; --b3:#79B785; --b4:#37AE8D; --b5:#1E8A74; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 96px}
.wrap{max-width:720px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
.han{font-family:var(--font-han)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;justify-content:space-between;padding-block:12px;flex-wrap:wrap}
.brand{font-weight:700;font-size:18px;letter-spacing:.01em;display:flex;align-items:baseline;gap:8px}
.brand .han{color:var(--accent);font-size:22px}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:6px}
.dot.ok{background:var(--good)} .dot.err{background:var(--bad)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
nav.tabs .in{display:flex;width:100%;max-width:720px;gap:4px}
nav.tabs button{flex:1;border:0;background:none;padding:8px 2px;border-radius:10px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .g{font-family:var(--font-han);font-size:19px;line-height:1.1}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-block:12px}
.grid{display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:700}
h3{font-size:17px;margin:0 0 6px}
p{margin:0 0 8px}
.muted{color:var(--muted)} .small{font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.ghost{background:none}
.btn[disabled]{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
textarea,input[type=text],input[type=date],select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:130px;resize:vertical;font-size:17px;line-height:1.6}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--surface2)}
.bar i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--c);margin-right:5px}
.ring{--p:0;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface2) 0);display:grid;place-items:center;flex:none}
.ring b{width:64px;height:64px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:19px;font-variant-numeric:tabular-nums}
.stat b{font-size:22px;font-variant-numeric:tabular-nums;display:block}
.plan{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.plan li{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.plan li .tick{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:12px}
.plan li.done .tick{background:var(--good);border-color:var(--good);color:#fff}
.plan li.done .t{text-decoration:line-through;color:var(--muted)}
.flash{text-align:center;padding:28px 16px;min-height:300px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.flash .big{font-family:var(--font-han);font-size:clamp(46px,16vw,76px);line-height:1.15;font-weight:700}
.flash .py{font-size:22px;color:var(--accent);font-weight:600}
.flash .en{font-size:19px}
.flash .ex{margin-top:6px;padding:12px;background:var(--bg);border-radius:10px;text-align:left}
.flash .ex .zh{font-family:var(--font-han);font-size:19px;line-height:1.7}
.flash mark{background:var(--accent-soft);color:var(--ink);padding:0 2px;border-radius:3px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate button{padding:10px 4px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.rate button small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.rate .r0{border-color:var(--b1)} .rate .r1{border-color:var(--b2)} .rate .r2{border-color:var(--b4)} .rate .r3{border-color:var(--b5)}
.prog{height:6px;background:var(--surface2);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.badge{font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--surface2);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.badge.good{background:var(--accent-soft);color:var(--accent)}
.mistake{border-left:3px solid var(--bad);padding:6px 10px;margin-block:8px;background:var(--bg);border-radius:0 8px 8px 0}
.mistake .o{text-decoration:line-through;color:var(--bad)} .mistake .f{color:var(--good);font-weight:600}
.han-text{font-family:var(--font-han);font-size:18px;line-height:1.8}
.ok{color:var(--good)} .miss{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent);border-radius:3px}
.msgs{display:grid;gap:8px;margin-bottom:12px}
.msg{padding:10px 12px;border-radius:12px;white-space:pre-wrap;max-width:92%}
.msg.u{background:var(--accent);color:var(--on-accent);justify-self:end}
.msg.a{background:var(--surface);border:1px solid var(--line);justify-self:start;font-family:var(--font-han);font-size:16.5px;line-height:1.7}
.opt{display:block;width:100%;text-align:left;margin-top:6px;border:1px solid var(--line);background:var(--surface);padding:9px 12px;border-radius:10px;cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
details{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-block:8px;background:var(--surface)}
summary{cursor:pointer;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-weight:600;z-index:9;max-width:90vw}
.sk{display:grid;grid-template-columns:84px 1fr 56px;gap:10px;align-items:center;font-size:13.5px;margin-block:6px}
.sk .prog{height:9px}
.sk .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="han">老师</span><span>Laoshi</span></div>
    <div class="row">
      <span class="small muted" id="sync"></span>
      <div class="seg" id="langseg" role="group" aria-label="Language"></div>
    </div>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div class="toast" id="toast" hidden></div>

<script>
/* ============ DATA ============ */
// [word, reading, meaning, level, topic, example, translation]
const SEED = {
zh: [],
ja: [
['約束','やくそく','promise','N4','Daily life','友達と七時に会う約束をしました。','I promised to meet a friend at seven.'],
['予定','よてい','plan; schedule','N4','Daily life','週末の予定はありますか。','Do you have plans this weekend?'],
['準備','じゅんび','preparation','N4','Daily life','出かける準備はできましたか。','Are you ready to head out?'],
['遅れる','おくれる','to be late','N4','Daily life','電車が遅れて、会議に間に合わなかった。','The train was late and I missed the meeting.'],
['忘れる','わすれる','to forget','N4','Daily life','傘を忘れてしまいました。','I forgot my umbrella.'],
['心配','しんぱい','worry','N4','Feelings','試験のことが心配です。',"I'm worried about the exam."],
['経験','けいけん','experience','N4','Work & study','日本で働いた経験があります。','I have experience working in Japan.'],
['相談','そうだん','to consult','N4','Work & study','先生に進路を相談しました。','I consulted my teacher about my path.'],
['片付ける','かたづける','to tidy up','N4','Daily life','部屋を片付けないといけない。','I have to tidy my room.'],
['引っ越す','ひっこす','to move house','N4','Daily life','来月、新しい家に引っ越します。','I move to a new home next month.'],
['大切','たいせつ','important; precious','N4','Feelings','健康は大切です。','Health is important.'],
['続ける','つづける','to continue','N4','Work & study','毎日日本語の勉強を続けています。','I keep studying Japanese every day.'],
['慣れる','なれる','to get used to','N3','Daily life','やっとこの生活に慣れてきた。',"I've finally gotten used to this life."],
['急に','きゅうに','suddenly','N3','Daily life','急に雨が降ってきた。','It suddenly started raining.'],
['おすすめ','おすすめ','recommendation','N4','Shopping & tech','おすすめの店を教えてください。','Please tell me a shop you recommend.'],
['残念','ざんねん','unfortunate','N4','Feelings','行けなくて残念です。',"It's a pity I can't go."]
]};

const BIG=[/*DATA*/];
BIG.forEach(r=>SEED.zh.push(r));

const BIGJ=[/*DATA*/];
BIGJ.forEach(r=>SEED.ja.push(r));

const LANGS = {
  zh:{name:'中文',en:'Chinese',speech:'zh-CN',read:'pinyin',hide:['HSK 3','HSK 4'],defTarget:'HSK 6',defExam:'2027-02-28',target:['HSK 5','HSK 6','HSK 7-9'],placeLevels:['HSK 5','HSK 6','HSK 7-9'],
      goal:'the new HSK 3.0 exam with a compulsory speaking section and a writing section',
      who:'English-speaking adult who studied for the old HSK 5 (about 2,500 words) and wants natural everyday Mandarin, not textbook Chinese'},
  ja:{name:'日本語',en:'Japanese',speech:'ja-JP',read:'reading',hide:[],start:'N5',defTarget:'N3',defExam:'2027-02-28',target:['N3','N2','N1'],placeLevels:['N5','N4','N3','N2'],
      goal:'the JLPT with attention to speaking and writing',who:'English-speaking adult with about 3 years of Japanese and a very uneven profile: reading is relatively strong thanks to Chinese kanji knowledge, but listening and speaking are weak, and grammar exceptions and conjugation are shaky; vocabulary has gaps. Wants natural everyday Japanese'}
};
const BOXES=['New','Learning','Familiar','Known','Solid','Mastered'];
const BOXC=['var(--surface2)','var(--b1)','var(--b2)','var(--b3)','var(--b4)','var(--b5)'];
const IV=[0,0,1,3,8,21];
const ERRCATS='grammar|conjugation|exception|word choice|word order|measure word|particle|tone/pronunciation|character|register|missing word|punctuation|other';
const GOALS={c:20,w:4,s:4,r:3,l:3}; // per week-ish targets: cards/day, writing, speaking, reading, listening

/* ============ STATE & STORAGE ============ */
const S={lang:'zh',tab:'today',main:{},words:{},logs:[],ready:false,sync:'local',
  ses:null,cardUI:{level:'',topic:'',mode:'read',reveal:false},
  pr:{sub:'writing',w:{kind:'sentence'},s:{kind:'question'},r:{},l:{},a:{},c:{focus:'Mixed'}},
  busy:{},rec:null,placement:null,logFilter:'all'};
let db=null,uid=null,sample=null;
const $=s=>document.querySelector(s);
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L=()=>LANGS[S.lang];
const defMain=(lg=S.lang)=>({prof:{level:'',exam:LANGS[lg].defExam||'',newPerDay:10,target:LANGS[lg].defTarget||LANGS[lg].target[0],rate:0.85},srs:{},days:{},ex:{},chat:[]});
const M=()=>S.main[S.lang]||(S.main[S.lang]=defMain());
const dstr=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dnum=(s=dstr())=>Math.floor(Date.parse(s+'T00:00:00Z')/864e5);
const TODAY=()=>dnum();
const day=()=>{const m=M();return m.days[dstr()]||(m.days[dstr()]={c:0,n:0,w:0,s:0,r:0,l:0})};
const allWords=()=>{const seen=new Set(),out=[];for(const w of [...SEED[S.lang].map(a=>({w:a[0],p:a[1],m:a[2],l:a[3],t:a[4],z:a[5],e:a[6]})),...(S.words[S.lang]||[])]){if((L().hide||[]).includes(w.l))continue;if(!seen.has(w.w)){seen.add(w.w);out.push(w)}}return out.filter(w=>!(L().hide||[]).includes(w.l))};
const work=()=>M().prof.level||L().start||M().prof.target;
const mean=w=>w.m||((M().ex[w.w]||[])[2])||'';
const wordById=id=>allWords().find(w=>w.w===id);
let toastT;function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,3200)}

const timers={},inflight={},pending={};
function save(key,val){
  pending[key]=val;
  try{localStorage.setItem('laoshi_'+key,JSON.stringify(val))}catch{}
  if(!db||!uid)return;
  clearTimeout(timers[key]);timers[key]=setTimeout(()=>flush(key),700);
}
async function flush(key){
  if(inflight[key])return;inflight[key]=true;
  try{
    while(pending[key]!==undefined){
      const v=pending[key];delete pending[key];
      await db.collection('data/users/'+uid).doc(key).set(v);
    }
    S.sync='saved';
  }catch(e){S.sync='error'}
  inflight[key]=false;paintSync();
}
function saveMain(){const {ex,srs,...rest}=M();save(S.lang+'_main',rest)}
const shard=w=>{let n=0;for(const c of String(w))n+=c.charCodeAt(0);return n%8};
function saveEx(ws){const ex=M().ex,ks=new Set((ws||Object.keys(ex)).map(shard));for(const k of ks){const o={};for(const w in ex)if(shard(w)===k)o[w]=ex[w];save(S.lang+'_ex'+k,{ex:o})}}
function saveSrs(ws){const sr=M().srs,ks=new Set((ws||Object.keys(sr)).map(shard));for(const k of ks){const o={};for(const w in sr)if(shard(w)===k)o[w]=sr[w];save(S.lang+'_srs'+k,{srs:o})}}
function paintSync(){
  const t=S.sync==='saved'?['ok','Saved to your account']:S.sync==='error'?['err','Not synced']:['','This device only'];
  $('#sync').innerHTML='<span class="dot '+t[0]+'"></span>'+t[1];
}
async function loadKey(key){
  try{if(db&&uid){const s=await db.collection('data/users/'+uid).doc(key).get();if(s.exists)return s.data()}}catch{}
  try{return JSON.parse(localStorage.getItem('laoshi_'+key))}catch{return null}
}
async function boot(){
  render();
  try{
    const user=await claude.use('user');uid=user?await user.id():null;
    db=await claude.use('db');
    sample=await claude.use('sample');
  }catch{}
  S.sync=db&&uid?'saved':'local';
  for(const lg of Object.keys(LANGS)){
    const m=await loadKey(lg+'_main');
    if(m){const d=defMain(lg);S.main[lg]={...d,...m,prof:{...d.prof,...(m.prof||{})}};if(!LANGS[lg].target.includes(S.main[lg].prof.target))S.main[lg].prof.target=d.prof.target}
    const w=await loadKey(lg+'_words');S.words[lg]=(w&&w.list)||[];
    if(!S.main[lg])S.main[lg]=defMain(lg);
    const mm=S.main[lg];const legacy=Object.keys(mm.srs||{}).length>0;
    const ex0=await loadKey(lg+'_ex');mm.ex={...(mm.ex||{}),...((ex0&&ex0.ex)||{})};
    const sr={};
    for(let k=0;k<8;k++){const a=await loadKey(lg+'_ex'+k);if(a&&a.ex)Object.assign(mm.ex,a.ex);const b=await loadKey(lg+'_srs'+k);if(b&&b.srs)Object.assign(sr,b.srs)}
    mm.srs={...(mm.srs||{}),...sr};
    if(!mm.prof.goalV3){mm.prof.goalV3=1;mm.prof.seededJa=1;mm.prof.seededJa2=1;mm.prof.target=LANGS[lg].defTarget;if(!mm.prof.exam)mm.prof.exam=LANGS[lg].defExam}
    if(lg==='ja'&&!mm.prof.seededJa2){mm.prof.seededJa2=1;if(mm.prof.target==='N3')mm.prof.target='N2'}
    if(lg==='ja'&&!mm.prof.seededJa){mm.prof.seededJa=1;if(!mm.prof.exam)mm.prof.exam='2027-02-28';if(!mm.prof.level)mm.prof.target='N3'}
    if(legacy){const keep=S.lang;S.lang=lg;saveSrs();saveEx();saveMain();S.lang=keep}
  }
  await loadLogs();
  S.ready=true;paintSync();render();
}
async function loadLogs(){
  let list=[];
  try{
    if(db&&uid){const q=await db.collection('data/users/'+uid).get();list=q.docs.filter(d=>d.id.startsWith('log_')).map(d=>d.data())}
  }catch{}
  try{
    const loc=JSON.parse(localStorage.getItem('laoshi_logs')||'[]');
    const ids=new Set(list.map(x=>x.id));for(const x of loc)if(!ids.has(x.id))list.push(x);
  }catch{}
  S.logs=list.sort((a,b)=>b.t-a.t);
}
function addLog(entry){
  entry.t=Date.now();entry.lang=S.lang;entry.id='log_'+S.lang+'_'+entry.t;
  S.logs.unshift(entry);
  try{localStorage.setItem('laoshi_logs',JSON.stringify(S.logs.slice(0,150)))}catch{}
  if(db&&uid)db.collection('data/users/'+uid).doc(entry.id).set(entry).then(()=>{S.sync='saved';paintSync()}).catch(()=>{S.sync='error';paintSync()});
}

/* ============ AI HELPERS ============ */
function weak(){
  const c={};for(const e of S.logs.filter(x=>x.lang===S.lang).slice(0,40))for(const er of (e.res&&e.res.errors)||[])c[er.cat||'other']=(c[er.cat||'other']||0)+1;
  return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,5);
}
/* ============ BACKUP AND RESTORE ============ */
function collectBackup(){
  const b={app:'laoshi',v:1,exported:new Date().toISOString(),langs:{},logs:S.logs.slice()};
  for(const lg of Object.keys(LANGS)){
    const m=S.main[lg];if(!m)continue;
    const {ex,...rest}=m;
    b.langs[lg]={main:rest,ex:ex||{},words:S.words[lg]||[]};
  }
  return b;
}
async function doBackup(){
  const data=JSON.stringify(collectBackup());

function excItem(kind){
  if(kind==='day'){const n=Math.random()<0.75?pick(DAYN):1+Math.floor(Math.random()*31);return {base:n+'日',form:'date (day of the month)',answers:[DAYS[n]],note:n<=10||n===14||n===20||n===24?'Special date reading: '+n+'日 = '+DAYS[n]+'.':'Regular: number + にち.',tag:'exc:days of the month'}}
  if(kind==='daydur'){const n=pick([2,3,4,5,6,7,8,9,10,14,20]);return {base:n+'日間',form:'how many days',answers:[DAYS[n]+'かん'],note:'〜日間 uses the date reading + かん. Exception: 1日 (one day) is いちにち.',tag:'exc:days of the month'}}
  if(kind==='month'){const n=pick([4,7,9,1,2,3,5,6,8,10,11,12]);return {base:n+'月',form:'month name',answers:[MONTHS[n]],note:'4月 しがつ, 7月 しちがつ and 9月 くがつ are the irregular ones.',tag:'exc:months'}}
  const fromTable=(T,c,tag)=>{const [what,list,q]=T[c],l=list.split(','),ask=c!=='つ'&&Math.random()<0.12,n=ask?0:pick(TRICKN);
    const ans=(ask?q:l[n-1]).split('|');return {base:(ask?'何':(c==='つ'&&n===10?'十':n))+(c==='つ'&&n===10?'':c),form:'counter for '+what,answers:ans,note:'Sound changes with '+c+': '+[1,3,6,8,10].map(i=>i+c+' '+l[i-1].split('|')[0]).join(', ')+'.',tag:tag}};
  if(kind==='counter')return fromTable(CTR,pick(Object.keys(CTR)),'exc:counters');
  if(kind==='time'){const c=pick(Object.keys(TIMEC));return fromTable(TIMEC,c,'exc:time and age')}
  const s=pick(SPECIAL);return {base:s[0],form:'reading',answers:s[1].split('|'),note:'Special reading: it does not follow the sounds of its kanji.',tag:'exc:special readings'};
}
const XKIND={'Days of the month':['day','day','day','daydur'],'Months & dates':['month','month','day','day'],'Counters':['counter'],'Time, age & duration':['time'],'Special readings':['special'],'Mixed':['day','month','counter','counter','time','time','special','daydur']};
function genExc(){
  const x=S.pr.x,items=[],seen=new Set();
  for(let n=0;items.length<8&&n<100;n++){const it=excItem(pick(XKIND[x.focus]||XKIND.Mixed));if(seen.has(it.base))continue;seen.add(it.base);items.push(it)}

}

/* ---- Placement check (offline) ---- */
// Per level: vocabulary in both directions, one listening item, grammar from the fixed bank,
// and for Japanese a kanji reading and a conjugation item. Nothing is sent anywhere.
function mcWord(pool,w,kind){
  const others=shuffle(pool.filter(x=>x.w!==w.w&&x.m&&gloss(x.m)!==gloss(w.m)));
  if(kind==='meaning')return {q:'What does '+w.w+' mean?',options:[gloss(w.m),...others.slice(0,3).map(x=>gloss(x.m))],answer:0,skill:'vocab',why:w.w+' ('+w.p+'): '+w.m};
  if(kind==='word')return {q:'Which word means "'+gloss(w.m)+'"?',options:[w.w,...others.slice(0,3).map(x=>x.w)],answer:0,skill:'vocab',why:w.w+' ('+w.p+'): '+w.m};
  if(kind==='listen')return {q:'Listen. What does the word mean?',audio:S.lang==='ja'?w.p:w.w,options:[gloss(w.m),...others.slice(0,3).map(x=>gloss(x.m))],answer:0,skill:'listening',why:w.w+' ('+w.p+'): '+w.m};
  const same=others.filter(x=>x.p!==w.p&&[...x.p].length===[...w.p].length);
  const opts=[w.p,...[...new Set((same.length>=3?same:others).map(x=>x.p))].filter(p=>p!==w.p).slice(0,3)];
  return {q:'How is 【'+w.w+'】 read?',options:opts,answer:0,skill:'reading',why:w.w+' is read '+w.p+' ('+gloss(w.m)+').'};
}
function genPlacement(){
  const ja=S.lang==='ja',qs=[];
  for(const l of L().placeLevels){
    const pool=allWords().filter(w=>w.l===l&&w.m&&w.w&&w.p&&[...w.w].length>1&&!/^(counter|prefix|suffix|abbr|see )/i.test(w.m));
    if(pool.length<8)continue;
    const ws=rsample(pool,6),add=it=>{const u=uniqOpts(it);if(u.options.length>=3)qs.push(mixOpts({...u,level:l}))};
    add(mcWord(pool,ws[0],'meaning'));add(mcWord(pool,ws[1],ja?'meaning':'word'));add(mcWord(pool,ws[2],'listen'));
    if(ja){const k=pool.filter(w=>/[一-鿿]/.test(w.w)&&w.w!==w.p);if(k.length>=4)add(mcWord(k,pick(k),'reading'))}
    const bank=rsample((QBANK[S.lang]||[]).filter(q=>q.l===l),ja?1:2);
    bank.forEach(b=>add({q:b.q,options:b.options,answer:b.answer,skill:'grammar',why:b.point+': '+b.why}));
    if(ja&&JLV.indexOf(l)<=2){
      const vs=JVERBS.filter(v=>v[3]===l||(l==='N3'&&v[3]!=='N5')),f=pick(l==='N5'?['te','nai','ta','masu']:l==='N4'?['te','pot','ba','vol','nakatta']:['pass','caus','pot','ba']);
      for(let t=0;t<20;t++){const v=pick(vs);if((f==='pot'||f==='pass'||f==='caus'||f==='vol')&&NOPOT.has(v[0]))continue;const d=conjDistractors(v,f);if(d.length<3)continue;
        add({q:v[0]+(v[1]!==v[0]?'（'+v[1]+'）':'')+' → '+JFORM[f]+'?',options:[conj(v,f).p,...rsample(d,3)],answer:0,skill:'conjugation',why:conj(v,f).w+'. '+conjNote(v,f)});break}
    }
  }
  S.placement={qs,ans:{}};
}

/* ---- Writing and speaking prompts (offline) ---- */
function genWriting(){
  const w=S.pr.w,P=PROMPTS[S.lang]||{},tw=targetWords(3),ja=S.lang==='ja';
  const gl=x=>{const o=wordById(x);return o?x+' ('+gloss(mean(o))+')':x};
  let t;
  if(w.kind==='sentence')t={instruction:'Write one natural, everyday sentence that uses all three words.',material:tw.map(gl).join(' / '),words:tw,minChars:0};
  else if(w.kind==='reply'){const r=pickNew(P.reply||[],w.task&&w.task.material);t={instruction:r[2],material:r[0]+'：'+r[1],words:tw.slice(0,2),minChars:ja?40:30}}
  else{const r=pickNew(P.passage||[],w.task&&w.task.material);t={instruction:r[1]+' Try to use the words below.',material:r[0],words:tw,minChars:ja?150:100}}
  w.task=t;w.ans='';w.res=null;
}
function pickNew(list,cur){const a=list.filter(x=>!cur||!String(cur).includes(x[1])&&!String(cur).includes(x[0]));return pick(a.length?a:list)||['','','']}
function genSpeaking(){
  const s=S.pr.s,P=(PROMPTS[S.lang]||{}).speaking||[];
  const list=P.filter(x=>x[0]===s.kind&&(!s.task||x[1]!==s.task.question));
  const r=pick(list.length?list:P)||['','',''];
  s.task={question:r[1],question_en:r[2],cues:[],seconds:45};s.ans='';s.res=null;
}
// Without an AI key, corrections go to the Claude project chat: copy the task in the project's own format.
async function copyForClaude(kind){
  const t=kind==='writing'?S.pr.w:S.pr.s,a=(($(kind==='writing'?'#wans':'#sans')||{}).value||t.ans||'').trim();
  if(!t.task||a.length<2){toast('Write an answer first.');return}

  try{await navigator.clipboard.writeText(txt);toast('Copied. Paste it into your Claude project chat for the correction.')}catch{toast('Could not copy here. Select the text and copy it yourself.')}

}

/* ============ SPEECH ============ */
function speak(text,rate){
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);u.lang=L().speech;u.rate=rate||M().prof.rate||0.85;
    const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.replace('_','-').startsWith(L().speech));if(v)u.voice=v;
    speechSynthesis.speak(u);
  }catch{toast('Audio playback is not available here.')}
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function startRec(target,getBase,setText){
  if(!SR){toast('Voice capture is not available here. Use your keyboard microphone key instead.');return}
  stopRec();
  const base=getBase();let fin='';
  try{
    const r=new SR();r.lang=L().speech;r.continuous=true;r.interimResults=true;
    r.onresult=e=>{let it='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=t;else it+=t}setText(base+fin+it)};
    r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed')toast('Microphone is blocked in this view. Use your keyboard microphone key to dictate.');S.rec=null;render()};
    r.onend=()=>{if(S.rec&&S.rec.r===r){S.rec=null;render()}};
    r.start();S.rec={r,target};render();
  }catch{toast('Voice capture could not start.')}
}
function stopRec(){try{S.rec&&S.rec.r.stop()}catch{}S.rec=null}

function streak(){
  const m=M();let n=0,d=new Date();
  const act=x=>x&&(x.c+x.w+x.s+x.r+x.l+(x.g||0))>0;
  if(!act(m.days[dstr(d)]))d.setDate(d.getDate()-1);
  while(act(m.days[dstr(d)])){n++;d.setDate(d.getDate()-1)}
  return n;
}
function week(){
  const m=M(),t={c:0,w:0,s:0,r:0,l:0};
  for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);const x=m.days[dstr(d)];if(x)for(const k in t)t[k]+=x[k]||0}
  return t;
}
function boxCounts(){
  const c=[0,0,0,0,0,0],ws=allWords(),m=M();
  for(const w of ws){const s=m.srs[w.w];c[s?s[0]:0]++}
  return c;
}
function guardInfo(){
  const m=M(),cap=m.prof.dueCap===undefined?150:m.prof.dueCap,due=dueCount();
  return {cap,due,on:cap>0&&due>cap};
}
function dueCount(){const t=TODAY(),m=M();return allWords().filter(w=>{const s=m.srs[w.w];return s&&s[0]>0&&s[1]<=t}).length}
function paceInfo(){
  const m=M(),num=l=>{const x=/(\d)/.exec(l||'');return x?+x[1]:0},tg=num(m.prof.target);
  const scope=allWords().filter(w=>S.lang==='ja'?num(w.l)>=tg:num(w.l)<=tg);

  const days=m.prof.exam?dnum(m.prof.exam)-TODAY():null;
  const per=Math.max(1,m.prof.newPerDay);
  const fin=new Date();fin.setDate(fin.getDate()+Math.ceil(unseen/per));
  return {unseen,total:scope.length,days,need:days!=null&&days>0?Math.ceil(unseen/Math.max(1,days-14)):null,per,fin:dstr(fin)};
}

function scoped(){const u=S.cardUI;return allWords().filter(w=>(!u.level||w.l===u.level)&&(!u.topic||w.t===u.topic))}
function buildQueue(extra){
  const m=M(),t=TODAY(),d=day();
  const due=[],fresh=[];
  for(const w of scoped()){const s=m.srs[w.w];if(!s||s[0]===0)fresh.push(w.w);else if(s[1]<=t)due.push(w.w)}
  due.sort((a,b)=>m.srs[a][0]-m.srs[b][0]);
  const dif=l=>{const x=/(\d)/.exec(l||'');const n=x?+x[1]:9;return S.lang==='ja'?6-n:n};
  const lm={};allWords().forEach(w=>{lm[w.w]=dif(w.l)});
  fresh.sort((a,b)=>lm[a]-lm[b]);
  const cap=m.prof.dueCap===undefined?150:m.prof.dueCap;
  const guard=cap>0&&dueCount()>cap;
  const n=extra?10:Math.max(0,m.prof.newPerDay-d.n);
  const q=[...due,...(guard?[]:fresh.slice(0,n))];
  return q.slice(0,80);
}
function startSession(extra){
  const q=buildQueue(extra);
  S.ses=q.length?{queue:q,total:q.length,done:0,reveal:false,extra:!!extra}:{queue:[],total:0,done:0,empty:true};
  S.cardUI.reveal=false;render();
}
function preview(box,r){
  const nb=r===0?1:r===1?Math.max(box,1):r===2?Math.min(5,Math.max(box+1,2)):Math.min(5,Math.max(box+2,3));
  if(r===0)return 'again';
  const iv=r===1?(nb>=2?Math.max(IV[nb],1):0):IV[nb];
  return iv===0?'soon':iv+'d';
}
function knowCard(){
  const ses=S.ses;if(!ses||!ses.queue.length)return;
  const id=ses.queue[0],m=M();
  const s=m.srs[id]||[0,0,0,0];
  s[0]=Math.max(4,s[0]);s[1]=TODAY()+14;s[2]++;m.srs[id]=s;
  const d=day();d.c++;d.k=(d.k||0)+1;
  ses.queue.shift();ses.done++;ses.reveal=false;
  if(!ses.queue.length)ses.finished=true;
  saveMain();saveSrs([id]);render();
}
function rateCard(r){
  const ses=S.ses;if(!ses||!ses.queue.length)return;
  const id=ses.queue[0],m=M();let s=m.srs[id]||[0,0,0,0];const wasNew=s[0]===0;let box=s[0];
  if(r===0){box=1;s[3]++}else if(r===1)box=Math.max(box,1);else if(r===2)box=Math.min(5,Math.max(box+1,2));else box=Math.min(5,Math.max(box+2,3));
  const iv=r===1?(box>=2?Math.max(IV[box],1):0):IV[box];
  s[0]=box;s[1]=TODAY()+iv;s[2]++;m.srs[id]=s;
  const d=day();d.c++;if(wasNew)d.n++;
  ses.queue.shift();
  if(box===1){ses.queue.splice(Math.min(3,ses.queue.length),0,id)}else ses.done++;

  if(!ses.queue.length)ses.finished=true;
  render();
}

function cmp(target,heard){

  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=A[i-1]===B[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  const ok=new Set();let i=m,j=n;
  while(i>0&&j>0){if(A[i-1]===B[j-1]){ok.add(ai[i-1]);i--;j--}else if(dp[i-1][j]>=dp[i][j-1])i--;else j--}
  return {html:a.map((c,k)=>isL(c)?`<span class="${ok.has(k)?'ok':'miss'}">${h(c)}</span>`:h(c)).join(''),pct:m?Math.round(ok.size/m*100):0};
}

function weekData(){

function subPlacement(){
  const p=S.placement,lv=L().placeLevels,ja=S.lang==='ja';
  const idxd=p.qs.map((q,i)=>[q,i]);
  const use=idxd.filter(x=>!(ja&&x[0].skill==='reading'));
  const pct=(arr,l)=>{const a=arr.filter(x=>x[0].level===l);return a.length?{n:a.length,pct:Math.round(a.filter(x=>p.ans[x[1]]===x[0].answer).length/a.length*100)}:null};
  const by=lv.map(l=>{const o=pct(use,l);return o?{l,pct:o.pct,n:o.n}:null}).filter(Boolean);
  let level=lv[0];for(const b of by){if(b.pct>=60)level=b.l;else break}
  const skills={};
  for(const sk of [...new Set(p.qs.map(q=>q.skill).filter(Boolean))]){const a=idxd.filter(x=>x[0].skill===sk);skills[sk]=Math.round(a.filter(x=>p.ans[x[1]]===x[0].answer).length/a.length*100)}
  let readLevel='';
  if(ja){const rd=idxd.filter(x=>x[0].skill==='reading');readLevel=level;for(const l of lv){const o=pct(rd,l);if(o&&o.pct>=60)readLevel=l}}
  const score=p.qs.filter((q,i)=>p.ans[i]===q.answer).length;
  p.result={level,by,skills,readLevel};p.score=score;
  const pr=M().prof;pr.level=level;pr.skills=skills;pr.readLevel=readLevel;
  saveMain();
  pushHist({mode:'full',level,pct:Math.round(score/p.qs.length*100),skills});
  addLog({type:'placement',level,score,of:p.qs.length,summary:`Estimated ${level}${readLevel&&readLevel!==level?' (reading about '+readLevel+')':''}: ${score}/${p.qs.length}. `+by.map(b=>b.l+' '+b.pct+'%').join(', ')+'. Skills: '+Object.entries(skills).map(([k,v])=>k+' '+v+'%').join(', ')});
}
function importWords(){
  const t=($('#imp')||{}).value||'';const add=[];
  for(const line of t.split('\n')){const p=line.split(/[,，\t]/).map(s=>s.trim());if(p.length>=3&&p[0]&&p[1]&&p[2])add.push({w:p[0],p:p[1],m:p[2],l:S.cardUI.level||M().prof.target,t:'Imported',z:p[3]||'',e:p[4]||''})}
  if(!add.length){toast('No valid lines found.');return}
  const have=new Set(allWords().map(w=>w.w));const n=add.filter(x=>!have.has(x.w));
  S.words[S.lang]=[...(S.words[S.lang]||[]),...n];save(S.lang+'_words',{list:S.words[S.lang]});
  toast(n.length+' words imported');render();
}

function jaPrompt(m,p){

  const kinds={
   yomi:`Type: kanji reading. Each question is a natural sentence with one word written in kanji inside 【】; the options are four hiragana readings.`,
   hyouki:`Type: orthography. Each question is a sentence with one word written in hiragana inside 【】; the options are four kanji spellings.`,
   bunmyaku:`Type: contextual vocabulary. Each question is a sentence with a blank （　　）; the options are four words of similar form that differ in meaning.`,
   ruigi:`Type: closest meaning. Each question is a sentence with a word or phrase in 【】; the options are four words or phrases and one is closest in meaning.`,
   youhou:`Type: usage. Each question gives one word as "q"; the four options are sentences and only one uses the word correctly.`,
   gram1:`Type: grammar form. Each question is a sentence with a blank （　　）; the options are four grammatical forms or particles.`,
   gram2:`Type: sentence composition with ★. Each question shows a sentence template such as "＿＿＿ ＿＿＿ ★ ＿＿＿ 。" with the surrounding words; the four options are the four fragments to arrange. "answer" is the index of the fragment that goes in the ★ position of the correct sentence, and "why" gives the full correct sentence.`,
   gram3:`Type: text grammar. Write passages of 150-250 characters (a short essay or email) with blanks [[1]], [[2]]... (numbered from 1 within each passage); every blank is a question with four options. ${n} blanks in total.`,
   readS:`Type: short reading. Write short passages of 80-150 characters (emails, notices, memos) with one question each; ${n} questions in total.`,
   readM:`Type: medium reading. Write passages of 200-300 characters (explanations, essays, instructions) with 3 questions each; ${n} questions in total.`,
   readL:`Type: long reading. Write passages of 400-550 characters with 3-4 questions each (main idea, reason, meaning of an expression); ${n} questions in total.`,
   gokei:`Type: word formation. Each question is a sentence with a blank （　　） that needs the right prefix, suffix or compound element (for example 〜的, 〜性, 〜化, 非〜, 〜感); four options.`,
   readX:`Type: integrated comprehension. Write two short texts A and B (100-180 characters each) on the same topic with different viewpoints, and 2 questions that compare them; ${n} questions in total.`,
   readC:`Type: claim comprehension. Write a long essay or editorial of 600-900 characters with a clear argument and 3 questions about the author's claim, reasoning and implied meaning; ${n} questions in total.`,
   listenX:`Type: integrated listening. Each item is a longer discussion or lecture of 250-400 characters involving several viewpoints; each has 2 questions that require comparing them; ${n} questions in total.`,
   readI:`Type: information retrieval. Write one text such as an advertisement, notice or timetable with several conditions, and 2 questions that require finding the right item; ${n} questions in total.`,
   task:`Type: task comprehension. Each item is a dialogue of 4-8 turns about what a person must do next; "audio" is the dialogue; the question is what the person will do first; options are Japanese actions. ${n} items.`,
   point:`Type: point comprehension. Each item is a dialogue; the question asks the reason or detail; ${n} items.`,
   gist:`Type: gist comprehension. Each item is a short monologue (100-200 characters); the question asks the main point; ${n} items.`,
   express:`Type: situational expression. "audio" describes a situation in Japanese and ends by asking what to say; the options are three or four possible things to say, one appropriate. ${n} items.`,
   response:`Type: quick response. "audio" is one short utterance; the options are three replies (3 options), one appropriate. ${n} items.`
  };
  return base+kinds[p.kind]+'\n'+shape+(m.adapt===false?'':adaptCtx());
}
function partPrompt(m,k,p){
  if(S.lang==='ja')return jaPrompt(m,p);

  const base=`You are writing part of a practice paper for ${lv}, in natural, current, everyday-to-formal Mandarin like the official sample papers (topics: work, study, society, culture, technology, daily life). ${scope}\n`;
  const shape=`Return ONLY JSON {"groups":[{"audio": spoken script (listening only, dialogue turns on separate lines without speaker labels), "text": reading passage (reading only), "bank": [candidate strings] (only for order and sentence-fill), "questions":[{"q": question in Chinese (omit for blanks), "options": [strings], "answer": index, "why": short English explanation}]}]}.`;
  const kinds={
   short:`Write ${n} listening items. Each item is a short spoken exchange or statement (1-4 sentences) with ONE question and 4 options (options 6-12 characters, like the sample paper).`,
   tf:`Write ${n} listening items: spoken passages of 60-150 characters, each followed by one statement about it; the options are exactly ["符合","不符合","没提到"] (matches / does not match / not mentioned); include all three kinds of answer.`,

   passage:`Write reading passages of 180-320 characters (articles, notices, stories, opinion pieces), each followed by 3-4 four-option questions testing detail, inference and main idea; ${n} questions in total.`,
   cloze:`Write ${Math.max(1,Math.round(n/4))} reading passages of 120-200 characters. Each has blanks written as [[1]], [[2]]... numbered from 1 within the passage; ${n} blanks in total. Every blank has 4 options (${m.level==='HSK 5'?'words or phrases':'words'}) and the questions array lists the blanks in order.`,
   order:`Write ${Math.max(1,Math.round(n/5))} paragraph-ordering tasks. Each is one coherent text of 5 paragraphs shuffled and labelled A-E, placed in "bank" as strings like "A ...". Each task has 5 questions (positions 1-5) with options ["A","B","C","D","E"]; answer is the index of the paragraph that belongs at that position in the correct order.`,
   sentfill:`Write ${Math.max(1,Math.round(n/5))} passages of 200-300 characters, each with 5 blanks [[1]]-[[5]]. Put 6 candidate sentences labelled A-F in "bank"; exactly one is a distractor that fits nowhere. Each blank is a question with options ["A","B","C","D","E","F"] and answer = index of the correct sentence.`
  };
  return base+kinds[p.kind]+'\n'+shape+(m.adapt===false?'':adaptCtx());

function okGroups(t,needText){
  const g=((t&&t.groups)||[]).filter(x=>x&&Array.isArray(x.questions));
  g.forEach(x=>x.questions=x.questions.filter(q=>q&&Array.isArray(q.options)&&q.options.length>=2&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<q.options.length));

}
async function mkGen(k){

      application:`an "application" task: a practical writing task (for example a notice, advertisement, email or message) with a clear situation and required content points; at least ${spec.tasks[0].min} characters.`,
      chart:`a "chart" task: give a small data table in text (title and 4-6 categories with percentages) that the candidate describes and analyses in at least ${spec.tasks[0].min} characters. instruction in English.`,
      topic:`a "topic" essay task: a short statement or question on an everyday or social topic asking for the candidate's experience or opinion; at least ${spec.tasks[1].min} characters.`};

    const est=r.listening.pct+r.reading.pct+r.writing.pct;estHtml=`Scaled estimate: about <b>${est}/300</b> (each of listening, reading and writing counts for 100). Check the pass mark for your level in the official notice; a tutor-written paper is only a rough guide.`;
  }
  const review=k=>r[k]?`<details><summary>${MNAME[k]} review · ${r[k].ok}/${r[k].of}</summary>${r[k].qa.map(q=>`<div class="mistake" style="border-left-color:${q.ok?'var(--good)':'var(--bad)'}"><div>${h(q.q)}</div><div class="small">${q.ok?'✓ ':'✗ '}<b>${h(q.correct)}</b>${q.ok?'':' <span class="muted">(you: '+h(q.picked)+')</span>'}</div><div class="small muted">${h(q.why)}</div></div>`).join('')}</details>`:'';
  const items=k=>r[k]?`<h2 style="margin-top:16px">${MNAME[k]}</h2>${r[k].items.map(x=>x.res?resultBlock(x.res):'<section class="card muted">Could not be marked.</section>').join('')}`:'';
  return `<section class="card"><div class="row between"><h3>Mock result · ${h(m.level)}</h3><span class="badge good">${m.overall}%</span></div>
    ${Object.keys(r).map(k=>`<div class="sk"><span>${MNAME[k]}</span><div class="prog"><i style="width:${r[k].pct}%"></i></div><span class="n">${r[k].pct}%</span></div>`).join('')}
    ${estHtml?`<p class="small muted" style="margin-top:10px">${estHtml}</p>`:''}
    <div class="row" style="margin-top:10px"><button class="btn primary" data-act="mkExit">Done</button></div>
    <p class="small muted">Corrections and wrong answers are saved in your Log.</p></section>
    ${Object.keys(r).filter(k=>r[k].qa).map(k=>review(k)).join('')}${items('writing')}${items('translation')}${items('speaking')}`;
}
/* ============ EVENTS ============ */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,v=t.dataset.v,U=S.cardUI;
  switch(a){
    case 'lang':stopRec();S.lang=v;S.ses=null;S.pr={sub:'writing',w:{kind:'sentence'},s:{kind:'question'},r:{},l:{},a:{},c:{focus:'Mixed'}};S.placement=null;clearInterval(mkTimer);S.mock=null;render();break;
    case 'tab':stopRec();S.tab=v;render();break;
    case 'go':{const [tb,sb]=v.split(':');S.tab=tb;if(sb)S.pr.sub=sb;if(tb==='cards')startSession();else render();break}
    case 'goplace':S.tab='level';genPlacement();render();window.scrollTo(0,0);break;
    case 'flevel':U.level=v;U.topic='';render();break;
    case 'ftopic':U.topic=v;render();break;
    case 'start':startSession(false);break;
    case 'more':startSession(true);break;
    case 'endses':S.ses=null;render();break;
    case 'reveal':S.ses.reveal=true;render();break;
    case 'know':knowCard();break;
        case 'quickplace':S.tab='level';startQuickPlace();render();break;
    case 'qpick':{S.placement.ans[+t.dataset.i]=+v;render();break}
    case 'subquick':subQuickPlace();render();break;
    case 'savekey':{const el=$('#aikey'),k=(el&&el.value||'').trim();if(!k){toast('Paste a key first.');break}try{localStorage.setItem('laoshi_api_key',k);toast('Key saved. Press Test key to check it.')}catch(e){toast('This browser would not save the key.')}render();break}
    case 'clearkey':try{localStorage.removeItem('laoshi_api_key')}catch(e){}toast('Key removed.');render();break;
    case 'testkey':guard('testkey',async()=>{const r=await ai('Reply with the single word OK.',{text:true,tier:'quick'});toast('Key works. Reply: '+String(r.text).slice(0,40))});break;
    case 'backup':doBackup();break;
    case 'dorestore':applyRestore();break;
    case 'cancelrestore':S.restore=null;render();break;
    case 'setnew':M().prof.newPerDay=+v;saveMain();render();break;
    case 'retest':guard('retest',genRetest);break;
    case 'rate':rateCard(+v);break;
    case 'say':speak(v==='__atarget'?(($('#atarget')||{}).value||''):v);break;
    case 'slow':speak(v,0.6);break;
    case 'newex':guard('ex',newExample);break;
    case 'import':importWords();break;
    case 'sub':stopRec();S.pr.sub=v;render();break;
    case 'wkind':S.pr.w.kind=v;S.pr.w.task=null;S.pr.w.res=null;render();break;
    case 'skind':S.pr.s.kind=v;S.pr.s.task=null;S.pr.s.res=null;render();break;
    case 'genw':genWriting();render();break;
    case 'subw':S.pr.w.ans=($('#wans')||{}).value||'';guard('sw',subWriting);break;
    case 'gens':stopRec();genSpeaking();render();break;
    case 'copyclaude':copyForClaude(v);break;
    case 'subs':stopRec();S.pr.s.ans=($('#sans')||{}).value||'';guard('ss',subSpeaking);break;
    case 'recspeak':{const ta=$('#sans');startRec('speak',()=>ta?ta.value+(ta.value?' ':''):'',x=>{const el=$('#sans');if(el){el.value=x;S.pr.s.ans=x}});break}
    case 'recaloud':{startRec('aloud',()=>'',x=>{const el=$('#aheard');if(el){el.value=x;S.pr.a.heard=x}});break}
    case 'stoprec':stopRec();render();break;
    case 'cmp':S.pr.a.target=($('#atarget')||{}).value||'';S.pr.a.heard=($('#aheard')||{}).value||'';render();break;
    case 'toaloud':S.pr.a={target:v,heard:''};S.pr.sub='aloud';S.tab='practice';render();window.scrollTo(0,0);break;
    case 'grfocus':S.pr.g=S.pr.g||{};S.pr.g.focus=v;render();break;
    case 'gengr':guard('ggr',genGrammar);break;
    case 'pickg':{const g=S.pr.g;g.ans=g.ans||{};g.ans[+t.dataset.i]=+v;render();break}
    case 'subgr':subGrammar();render();break;
    case 'exfocus':S.pr.x=S.pr.x||{};S.pr.x.focus=v;render();break;
    case 'genex':genExc();render();break;
    case 'subex':subExc();render();break;
    case 'blitz':S.tab='practice';S.pr.sub='grammar';S.pr.g={focus:'My weak points'};render();guard('ggr',genGrammar);break;
    case 'mkLevel':{const m=mkS();m.level=v;m.secs=Object.fromEntries(mkOrder(m).map(k=>[k,1]));render();break}
    case 'mkSec':{const m=mkS();m.secs[v]=m.secs[v]?0:1;render();break}
    case 'mkStart':mkStart();break;
    case 'mkRetry':mkGenAll();break;
    case 'mkExit':clearInterval(mkTimer);stopRec();try{speechSynthesis.cancel()}catch{}S.mock=null;render();break;
    case 'mkPick':{const m=S.mock,k=m.plan[m.cur];m.ans[k][+t.dataset.i]=+v;render();break}
    case 'mkPlay':{const m=S.mock,i=+t.dataset.i;m.plays['g'+i]=(m.plays['g'+i]||0)+1;speak(m.data[m.plan[m.cur]].groups[i].audio,0.95);render();break}
    case 'mkSay':{const m=S.mock,i=+t.dataset.i;m.plays['s'+i]=(m.plays['s'+i]||0)+1;speak(m.data.speaking.tasks[i].prompt,0.95);render();break}
    case 'mkRec':{const i=+t.dataset.i;startRec('mk'+i,()=>{const ta=$('#mk-s-'+i);return ta?ta.value+(ta.value?' ':''):''},x=>{const el=$('#mk-s-'+i);if(el){el.value=x;S.mock.ans.speaking=S.mock.ans.speaking||{};S.mock.ans.speaking[i]=x}});break}
    case 'mkSubmit':mkSubmit();break;
    case 'dfocus':S.pr.c.focus=v;render();break;
    case 'gendr':genDrill();render();break;
    case 'subdr':subDrill();render();break;
    case 'genp':guard('gp'+v,()=>genPassage(v));break;
    case 'pick':{const k=S.pr.sub==='listening'?'l':'r';S.pr[k].ans[+t.dataset.q]=+v;render();break}
    case 'subp':{const k=S.pr.sub==='listening'?'l':'r';submitPassage(k);render();break}
    case 'playp':speak(S.pr.l.task.text);break;
    case 'playslow':speak(S.pr.l.task.text,0.6);break;
    case 'showtext':S.pr.l.showText=!S.pr.l.showText;render();break;
    case 'pickp':S.placement.ans[+t.dataset.q]=+v;render();break;
    case 'subplace':subPlacement();render();break;
    case 'doneplace':S.placement=null;render();break;
    case 'lfilter':S.logFilter=v;render();break;
    case 'export':exportLog();break;
  }
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='wans'){S.pr.w.ans=e.target.value;const c=$('#wcount');if(c)c.textContent=[...e.target.value].length+' characters'}
  else if(id==='sans')S.pr.s.ans=e.target.value;
  else if(id==='atarget')S.pr.a.target=e.target.value;
  else if(id==='aheard')S.pr.a.heard=e.target.value;
  else if(e.target.dataset.exc!==undefined){const x=S.pr.x;x.ans=x.ans||{};x.ans[+e.target.dataset.exc]=e.target.value}
  else if(e.target.dataset.mk){const [sec,i]=e.target.dataset.mk.split(':');if(S.mock){S.mock.ans[sec]=S.mock.ans[sec]||{};S.mock.ans[sec][+i]=e.target.value}}
  else if(e.target.dataset.drill!==undefined){S.pr.c.ans=S.pr.c.ans||{};S.pr.c.ans[+e.target.dataset.drill]=e.target.value}
});
document.addEventListener('change',e=>{
  if(e.target.id==='restorefile'){readRestore(e.target.files&&e.target.files[0]);e.target.value='';return}
  const k=e.target.dataset.chg;if(!k)return;
  if(k==='mode'){S.cardUI.mode=e.target.value;render();return}
  if(k==='mkonce'){mkS().once=e.target.checked;return}
  if(k==='mkfull'){mkS().full=e.target.checked;render();return}
  if(k==='mkadapt'){mkS().adapt=e.target.checked;return}
  const p=M().prof;
  p[k]=(k==='newPerDay'||k==='rate'||k==='dueCap')?+e.target.value:e.target.value;
  saveMain();render();
});
document.addEventListener('keydown',e=>{
  if(S.tab!=='cards'||!S.ses||!S.ses.queue.length)return;
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  if(e.key===' '&&!S.ses.reveal){e.preventDefault();S.ses.reveal=true;render()}
  else if(S.ses.reveal&&'1234'.includes(e.key))rateCard(+e.key-1);
  if((e.key==='k'||e.key==='K')&&S.ses&&S.ses.queue.length&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))knowCard();
});
boot();
</script>
